services:
  media-sorter:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: media-sorter:latest
    container_name: media-sorter
    restart: unless-stopped
    command: ["python", "-m", "src.main", "daemon"]
    # Synology 계정 권한으로 실행해야 생성 파일 소유권이 올바름
    user: "${PUID:-1026}:${PGID:-100}"
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Seoul}
      INPUT_DIR: ${INPUT_DIR:-/media/photo_inbox}
      TARGET_DIR: ${TARGET_DIR:-/media/homes/username/Photos}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-15}
      SETTLE_THRESHOLD: ${SETTLE_THRESHOLD:-30}
      STABLE_ROUNDS: ${STABLE_ROUNDS:-2}
      RAW_DIR_NAME: ${RAW_DIR_NAME:-RAW}
      JPG_DIR_NAME: ${JPG_DIR_NAME:-JPG}
      VIDEO_DIR_NAME: ${VIDEO_DIR_NAME:-Video}
      EXPORT_DIR_NAME: ${EXPORT_DIR_NAME:-Export}
      CREATE_EXPORT_DIR: ${CREATE_EXPORT_DIR:-false}
    volumes:
      # 동일 볼륨 즉시 이동(os.rename)을 보장하기 위해 상위 공통 볼륨을 /media 로 단일 마운트
      - ${HOST_BASE_DIR:-/volume1}:/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
